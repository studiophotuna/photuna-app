name: iOS — Build & Deploy to TestFlight

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "fastlane/**"
      - ".github/workflows/ios-testflight.yml"

  # Allow manual trigger from GitHub → Actions → Run workflow
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run (testflight | setup_match)"
        required: false
        default: "testflight"

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets → Actions):
#
#   REACT_APP_SUPABASE_URL           Supabase project URL
#   REACT_APP_SUPABASE_ANON_KEY      Supabase anon/public key
#   REACT_APP_API_URL                Railway API URL
#   REACT_APP_LICENSE_PUBLIC_KEY     RSA public key (multiline, base64 ok)
#
#   APPLE_TEAM_ID                    10-char team ID from developer.apple.com
#   APP_STORE_CONNECT_API_KEY_ID     Key ID from App Store Connect → Keys
#   APP_STORE_CONNECT_ISSUER_ID      Issuer ID from App Store Connect → Keys
#   APP_STORE_CONNECT_API_KEY_BASE64 The .p8 file content, base64-encoded
#                                    (cat AuthKey_XXX.p8 | base64 | pbcopy)
#
#   MATCH_GIT_URL                    HTTPS URL to your private certs repo
#                                    e.g. https://github.com/studiophotuna/match-certs.git
#   MATCH_PASSWORD                   Passphrase to encrypt/decrypt certs in match repo
#   MATCH_GIT_TOKEN                  GitHub Personal Access Token (repo scope) for
#                                    match repo write access
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  build-and-deploy:
    runs-on: macos-14          # M1 runner — fastest for iOS builds
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install JS dependencies ─────────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── 4. Build React app ─────────────────────────────────────────────────
      - name: Build React app
        run: npm run build
        env:
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_LICENSE_PUBLIC_KEY: ${{ secrets.REACT_APP_LICENSE_PUBLIC_KEY }}
          CI: "false"           # prevent treating warnings as errors

      # ── 5. Sync Capacitor iOS ──────────────────────────────────────────────
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ── 6. Ruby + Fastlane ─────────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true   # caches gems between runs

      # ── 7. Decode App Store Connect API key ───────────────────────────────
      - name: Set up App Store Connect API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" \
            | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      # ── 8. Compute match git auth (base64 of "x-access-token:<PAT>") ────────
      - name: Set up match git authorization
        run: |
          AUTH=$(echo -n "x-access-token:${{ secrets.MATCH_GIT_TOKEN }}" | base64)
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> $GITHUB_ENV

      # ── 9. Build + upload to TestFlight ───────────────────────────────────
      - name: Run Fastlane
        run: bundle exec fastlane ios ${{ github.event.inputs.lane || 'testflight' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: "com.photuna.app"
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ env.MATCH_GIT_BASIC_AUTHORIZATION }}
