<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA / iPad home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Photuna Booth" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Studio Photuna helps entrepreneurs launch and grow Korean-style photobooth businesses with Windows PC, DSLR support, QR sharing, cloud galleries, and customizable templates."
    />
    <meta
      name="keywords"
      content="Studio Photuna, Korean photobooth software, DSLR photobooth, QR photo sharing, cloud gallery, photobooth business"
    />
    <meta property="og:title" content="Studio Photuna - Korean-Style Photobooth Business Software" />
    <meta
      property="og:description"
      content="Launch a modern Korean-inspired photobooth business using your Windows PC and DSLR camera."
    />
    <meta property="og:type" content="website" />
    <!-- iPad home screen icon (167×167 for iPad Pro retina, 152×152 for other iPads) -->
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Studio Photuna - Launch a Korean-Style Photobooth Business</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      On Electron, preload.js sets window.electron via contextBridge before this
      script runs. On iPad / browser there is no preload, so we install a mutable
      placeholder object. index.js then calls Object.assign on this same object
      with the real capacitorShim methods — all module-level code that already
      cached `const native = window.electron` gains the full API because they
      hold a reference to this same object (Object.assign mutates in place).
    -->
    <script>
      if (typeof window !== 'undefined' && !window.electron && !window.api) {
        window.electron = { _capacitorPlaceholder: true };
        window.api = window.electron;
      }
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
